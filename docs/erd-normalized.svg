<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100">
  <defs>
    <style>
      .title { font: 700 28px 'Segoe UI', Arial, sans-serif; fill: #183153; }
      .subtitle { font: 400 15px 'Segoe UI', Arial, sans-serif; fill: #4b5d73; }
      .box-title { font: 700 18px 'Segoe UI', Arial, sans-serif; fill: #10243e; }
      .box-text { font: 400 14px 'Consolas', 'Courier New', monospace; fill: #23364d; }
      .label { font: 600 13px 'Segoe UI', Arial, sans-serif; fill: #37506b; }
      .entity { fill: #f9fbfd; stroke: #294a6d; stroke-width: 2; rx: 14; ry: 14; }
      .lookup { fill: #eef5fb; stroke: #5b84b1; stroke-width: 2; rx: 14; ry: 14; }
      .line { stroke: #456b92; stroke-width: 2.5; fill: none; }
      .crow { stroke: #456b92; stroke-width: 2.5; }
    </style>
  </defs>

  <rect width="1600" height="1100" fill="#ffffff"/>
  <text x="60" y="55" class="title">PARDS Normalized ERD</text>
  <text x="60" y="82" class="subtitle">Loop-free relationship structure based on the current project schema</text>

  <rect x="70" y="130" width="250" height="90" class="lookup"/>
  <text x="90" y="160" class="box-title">ROLES</text>
  <text x="90" y="188" class="box-text">PK role_id</text>
  <text x="90" y="210" class="box-text">role_name</text>

  <rect x="70" y="290" width="290" height="170" class="entity"/>
  <text x="90" y="320" class="box-title">USERS</text>
  <text x="90" y="348" class="box-text">PK user_id</text>
  <text x="90" y="370" class="box-text">FK role_id</text>
  <text x="90" y="392" class="box-text">name</text>
  <text x="90" y="414" class="box-text">email</text>
  <text x="90" y="436" class="box-text">password</text>
  <text x="90" y="458" class="box-text">is_active</text>

  <rect x="470" y="100" width="250" height="90" class="lookup"/>
  <text x="490" y="130" class="box-title">PROPERTY_CATEGORIES</text>
  <text x="490" y="158" class="box-text">PK category_id</text>
  <text x="490" y="180" class="box-text">category_name</text>

  <rect x="470" y="220" width="250" height="90" class="lookup"/>
  <text x="490" y="250" class="box-title">PROPERTY_CONDITIONS</text>
  <text x="490" y="278" class="box-text">PK condition_id</text>
  <text x="490" y="300" class="box-text">condition_name</text>

  <rect x="470" y="340" width="250" height="90" class="lookup"/>
  <text x="490" y="370" class="box-title">PROPERTY_STATUSES</text>
  <text x="490" y="398" class="box-text">PK property_status_id</text>
  <text x="490" y="420" class="box-text">status_name</text>

  <rect x="790" y="210" width="320" height="250" class="entity"/>
  <text x="810" y="240" class="box-title">PROPERTIES</text>
  <text x="810" y="268" class="box-text">PK property_id</text>
  <text x="810" y="290" class="box-text">FK category_id</text>
  <text x="810" y="312" class="box-text">FK condition_id</text>
  <text x="810" y="334" class="box-text">FK property_status_id</text>
  <text x="810" y="356" class="box-text">FK created_by</text>
  <text x="810" y="378" class="box-text">property_code</text>
  <text x="810" y="400" class="box-text">property_name</text>
  <text x="810" y="422" class="box-text">quantity</text>
  <text x="810" y="444" class="box-text">date_acquired</text>

  <rect x="1180" y="140" width="250" height="90" class="lookup"/>
  <text x="1200" y="170" class="box-title">ASSIGNMENT_STATUSES</text>
  <text x="1200" y="198" class="box-text">PK assignment_status_id</text>
  <text x="1200" y="220" class="box-text">status_name</text>

  <rect x="1180" y="280" width="300" height="210" class="entity"/>
  <text x="1200" y="310" class="box-title">ASSIGNMENTS</text>
  <text x="1200" y="338" class="box-text">PK assignment_id</text>
  <text x="1200" y="360" class="box-text">FK property_id</text>
  <text x="1200" y="382" class="box-text">FK teacher_id</text>
  <text x="1200" y="404" class="box-text">FK assigned_by</text>
  <text x="1200" y="426" class="box-text">FK assignment_status_id</text>
  <text x="1200" y="448" class="box-text">quantity_assigned</text>
  <text x="1200" y="470" class="box-text">date_assigned</text>

  <rect x="1180" y="590" width="250" height="90" class="lookup"/>
  <text x="1200" y="620" class="box-title">DISPOSAL_METHODS</text>
  <text x="1200" y="648" class="box-text">PK disposal_method_id</text>
  <text x="1200" y="670" class="box-text">method_name</text>

  <rect x="1180" y="720" width="250" height="90" class="lookup"/>
  <text x="1200" y="750" class="box-title">DISPOSAL_STATUSES</text>
  <text x="1200" y="778" class="box-text">PK disposal_status_id</text>
  <text x="1200" y="800" class="box-text">status_name</text>

  <rect x="1180" y="850" width="300" height="190" class="entity"/>
  <text x="1200" y="880" class="box-title">DISPOSALS</text>
  <text x="1200" y="908" class="box-text">PK disposal_id</text>
  <text x="1200" y="930" class="box-text">FK property_id</text>
  <text x="1200" y="952" class="box-text">FK disposed_by</text>
  <text x="1200" y="974" class="box-text">FK disposal_method_id</text>
  <text x="1200" y="996" class="box-text">FK disposal_status_id</text>
  <text x="1200" y="1018" class="box-text">disposal_date</text>

  <line x1="195" y1="220" x2="195" y2="290" class="line"/>
  <text x="205" y="262" class="label">1 to many</text>

  <line x1="360" y1="350" x2="790" y2="350" class="line"/>
  <text x="530" y="338" class="label">created_by</text>

  <line x1="720" y1="145" x2="790" y2="245" class="line"/>
  <text x="720" y="205" class="label">category_id</text>

  <line x1="720" y1="265" x2="790" y2="290" class="line"/>
  <text x="705" y="255" class="label">condition_id</text>

  <line x1="720" y1="385" x2="790" y2="335" class="line"/>
  <text x="680" y="370" class="label">property_status_id</text>

  <line x1="1110" y1="330" x2="1180" y2="330" class="line"/>
  <text x="1122" y="318" class="label">property_id</text>

  <line x1="1430" y1="230" x2="1430" y2="280" class="line"/>
  <text x="1440" y="260" class="label">status</text>

  <path d="M360 410 C520 520, 970 540, 1180 410" class="line"/>
  <text x="725" y="550" class="label">teacher_id / assigned_by</text>

  <line x1="1110" y1="940" x2="1180" y2="940" class="line"/>
  <text x="1122" y="928" class="label">property_id</text>

  <path d="M360 450 C560 760, 980 820, 1180 940" class="line"/>
  <text x="700" y="790" class="label">disposed_by</text>

  <line x1="1305" y1="680" x2="1305" y2="850" class="line"/>
  <text x="1315" y="770" class="label">method_id</text>

  <line x1="1360" y1="810" x2="1360" y2="850" class="line"/>
  <text x="1370" y="838" class="label">status_id</text>

  <text x="70" y="520" class="subtitle">Main path: Roles -> Users -> Properties -> Assignments / Disposals</text>
  <text x="70" y="545" class="subtitle">This keeps the ERD understandable and avoids circular table dependency.</text>
</svg>
